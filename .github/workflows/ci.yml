name: CI

# Installs the package from source, then regenerates every figure and checks the
# arrays against the published ones. The whole suite takes about two minutes

on:
  push:
    branches: [main, repackage]
  pull_request:
    branches: [main, repackage]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install from source
        run: |
          python -m pip install --upgrade pip
          pip install .
          correlated-traits --version
          correlated-traits --help

      - name: Self-checks
        working-directory: ${{ runner.temp }} #Run in a temp dir
        run: correlated-traits test

      - name: Regenerate every figure and verify against the published arrays
        working-directory: ${{ runner.temp }} #Run in a temp dir
        run: correlated-traits figures --results-dir "${{ runner.temp }}/ct-results"

      - name: Upload figures
        uses: actions/upload-artifact@v7
        with:
          name: figures
          path: ${{ runner.temp }}/ct-results/figures/
