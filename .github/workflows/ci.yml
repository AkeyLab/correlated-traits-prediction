name: CI

# Installs the package from source then runs the fast checks. The long
# simulations (figures 3, 4, S2, S3) are hours of CPU and are deliberately not
# run here

on:
  push:
    branches: [main, repackage]
  pull_request:
    branches: [main, repackage]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from source
        run: |
          python -m pip install --upgrade pip
          pip install .
          correlated-traits --version
          correlated-traits --help

      - name: Self-checks
        working-directory: ${{ runner.temp }} #Run in a temp dir
        run: correlated-traits test

      - name: Quick figure
        working-directory: ${{ runner.temp }} #Run in a temp dir
        run: |
          correlated-traits quick --results-dir "${{ runner.temp }}/ct-results"
          test -s "${{ runner.temp }}/ct-results/figures/Fig2_validation.png"
